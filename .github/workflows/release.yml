name: Release

# Publishes a versioned artifact on `v*` tags (organvm-engine #98).
# A `workflow_dispatch` run exercises the build + smoke path without
# cutting a release: the publish job only runs on tag pushes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # `python -m build` needs no secrets and no private dependency:
      # the runtime deps in pyproject.toml are public, and `ontologia`
      # is an optional extra the build does not install.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    # Tag pushes only: a dispatch dry run must never create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # softprops/action-gh-release is in the repo audit's recognised
      # release-action list (src/organvm_engine/ci/audit.py). Uses
      # GITHUB_TOKEN only; no new secret, no PyPI.
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # Install the artifact just built, not the checkout: this is what
      # proves the shipped package runs.
      - name: Install the built wheel in a clean venv
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install --upgrade pip
          .smoke-venv/bin/pip install dist/*.whl
      # `--registry` is a top-level flag; the bare `organvm registry
      # validate` form resolves the default registry path, which is a
      # local-machine path and does not exist on a runner. The shipped
      # minimal fixture is the registry this command can validate
      # anywhere, with no network, no secrets, and no private dep.
      - name: Smoke-test the installed artifact
        run: |
          .smoke-venv/bin/organvm --help
          .smoke-venv/bin/organvm --registry tests/fixtures/registry-minimal.json registry validate
