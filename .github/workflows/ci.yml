name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Repository-scoped read-only key; fork PRs do not receive this secret.
      - name: Fetch pinned private dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 4444J99/organvm-ontologia
          ref: ecc7ff7e3048562164a8973281d6794db5c16029
          path: .ci-dependencies/ontologia
          ssh-key: ${{ secrets.ONTOLOGIA_READ_KEY }}
          persist-credentials: false
          submodules: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./.ci-dependencies/ontologia
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/ tests/ --ignore SIM105
      - name: Type check with pyright
        run: pyright src/
      - name: Run tests
        run: pytest tests/ -v

  # Aggregate gate: reports a single, stable "test" status context (the matrix
  # legs report as "test-matrix (3.11)/(3.12)", which a bare required-context
  # named "test" can never match). Branch protection requires "test".
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to pass
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "::error::test-matrix did not succeed (result=${{ needs.test-matrix.result }})"
            exit 1
          fi
          echo "All test-matrix legs passed."
